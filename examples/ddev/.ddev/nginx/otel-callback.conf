# Same-origin callback endpoint for browser spans.
# Handled by the standalone script of the instrumentation package: it
# validates the spans and forwards them to OTEL_EXPORTER_OTLP_ENDPOINT.
location = /otel/v1/traces {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/vendor/mladenrtl/opentelemetry-auto-drupal/callback/traces.php;
    fastcgi_param SCRIPT_NAME /otel/v1/traces;
    fastcgi_param HTTPS $fcgi_https;
    fastcgi_pass unix:/run/php/php-fpm.sock;
    client_max_body_size 256k;
}

# The browser agent, served as a static file. Its URL carries a version, so
# it can be cached for a long time.
location = /otel/v1/agent.js {
    alias /var/www/html/vendor/mladenrtl/opentelemetry-auto-drupal/browser/agent.js;
    default_type application/javascript;
    expires 1y;
    add_header Cache-Control "public, immutable";
}
